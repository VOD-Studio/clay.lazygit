# Clay theme for lazygit. Generated by scripts/build.lua from clay.nvim's
# lua/clay/palette.lua; edit the generator, not this file.
gui:
  theme:
    # Keep the text colors of the selected line; the background marks it.
    selectedLineFgColor:
      - default
  darkTheme:
    activeBorderColor:
      - "#d97757" # clay
      - bold
    searchingActiveBorderColor:
      - "#e6e6e6" # bright
      - bold
    inactiveBorderColor:
      - "#444444" # float_border
    optionsTextColor:
      - "#7a7a7a" # comment
    selectedLineBgColor:
      - "#363636" # selection
    inactiveViewSelectedLineBgColor:
      - "#1e1e1e" # cursorline
    cherryPickedCommitFgColor:
      - "#e6e6e6" # bright
    cherryPickedCommitBgColor:
      - "#424242" # search
    markedBaseCommitFgColor:
      - "#121212" # bg
    markedBaseCommitBgColor:
      - "#aaaaaa" # secondary
    unstagedChangesColor:
      - "#aaaaaa" # secondary
    defaultFgColor:
      - "#cccccc" # fg
    authorColors:
      "*": "#8e8e8e" # muted
